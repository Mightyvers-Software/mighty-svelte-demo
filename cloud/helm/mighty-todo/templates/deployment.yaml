apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "mighty-todo.fullname" . }}"

spec:
  replicas: 1

  selector:
    matchLabels:
      app: "{{ include "mighty-todo.name" . }}"

  template:
    metadata:
      labels:
        app: "{{ include "mighty-todo.name" . }}"

    spec:
      containers:
        - name: mighty-todo

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"

            - name: HOST
              value: "0.0.0.0"

            - name: PORT
              value: "3000"

            - name: DATABASE_URL
              value: "{{ .Values.database.url }}"

          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/data

      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: "{{ include "mighty-todo.fullname" . }}-pvc"